[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "conformer-metric"
version = "0.1.0"
description = "Conformer ensemble diversity metrics with built-in iRMSD distances"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "irmsd>=0.1.2,<0.2"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13", "ty>=0.0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/conformer_metric"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 96
extend-exclude = [".uv-cache", "sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src", "examples"]
